name: Tests

# API integration tests. tests/globalSetup.js builds the Docker image, runs a
# throwaway container with a known admin key, and the tests call the real
# server through the browser API client (src/dist/web/js/api.js).
on:
  push:
  pull_request:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
